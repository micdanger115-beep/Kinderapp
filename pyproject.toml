[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "tanz_reachy"
version = "0.1.0"
description = "Kinderlieder mit Tanz für Reachy Mini – für Kleinkinder, ohne Sprache, per Antenne gesteuert"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini"
]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
tanz_reachy = "tanz_reachy.main:TanzReachy"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "build*"]

[tool.setuptools.package-data]
tanz_reachy = ["**/*"] # Also include all non-.py files
[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
